<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cutout Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--mat:#2E5A4C;--line:rgba(255,255,255,.08);--panel:#F7F6F1;--ink:#1D2320;--muted:#5E6B64;--hi:#F2C230;--danger:#C2452D;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mat:#1C3A31;--panel:#202624;--ink:#ECEFEA;--muted:#9AA8A0;--danger:#F07A5F}}
:root[data-theme="dark"]{--mat:#1C3A31;--panel:#202624;--ink:#ECEFEA;--muted:#9AA8A0;--danger:#F07A5F}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--mat);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.bar{background:var(--panel);display:flex;gap:.25rem;padding:.45rem .6rem;overflow-x:auto;align-items:center;flex:none}
.bar+.bar{border-top:1px solid rgba(127,127,127,.18)}
.sp{flex:1}
button,label.btn{font:inherit;font-weight:700;font-size:.85rem;border:0;border-radius:8px;padding:.55rem .75rem;background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
button:hover,label.btn:hover{background:rgba(127,127,127,.14)}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--hi);outline-offset:1px}
button.on{background:var(--hi);color:#1D2320}
button.solid,label.solid{background:var(--ink);color:var(--panel)}
button.danger{color:var(--danger)}
button:disabled{opacity:.35;cursor:default}
.tabs{display:inline-flex;background:rgba(127,127,127,.16);border-radius:10px;padding:3px;gap:2px;margin-left:.4rem}
.tabs button{padding:.45rem .9rem}
.tabs button[aria-selected="true"]{background:var(--hi);color:#1D2320}
.grp{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 .3rem 0 .1rem;white-space:nowrap}
.msg{font-size:.85rem;color:var(--muted);padding:0 .4rem;white-space:nowrap}
.warn{color:var(--danger)}
.chip{font-size:.85rem;font-weight:700;background:rgba(127,127,127,.14);border-radius:6px;padding:.3rem .55rem;white-space:nowrap;max-width:22rem;overflow:hidden;text-overflow:ellipsis}
.sw{width:1.2rem;height:1.2rem;border-radius:4px;border:1px solid rgba(127,127,127,.5);flex:none}
input[type=range]{width:110px;accent-color:var(--hi)}
#stage{flex:1;position:relative;overflow:hidden;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;touch-action:none}
#view{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#zoom{position:absolute;right:.6rem;bottom:.6rem;display:flex;gap:.2rem;background:var(--panel);border-radius:10px;padding:.2rem;align-items:center}
#zoom span{font-size:.8rem;font-weight:700;min-width:3.4rem;text-align:center}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:1.5rem}
#empty p{max-width:34ch;line-height:1.5;opacity:.85;margin:.6rem auto 1rem}
#empty .big{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
#empty label.btn{background:var(--hi);color:#1D2320;padding:.8rem 1.2rem;font-size:1rem}
select,input[type=color],textarea{font:inherit;font-size:.85rem;border-radius:6px;border:1px solid rgba(127,127,127,.4);background:var(--panel);color:var(--ink);padding:.3rem}
input[type=color]{width:2.2rem;height:2rem;padding:.1rem;flex:none}
textarea#tTxt{min-width:12rem;resize:none;padding:.4rem .55rem;font-weight:600;line-height:1.3;flex:none}
#out{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;z-index:5}
#out img{max-width:100%;max-height:70vh;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/16px 16px}
#out p{color:#fff;margin:0;text-align:center}
</style>
</head>
<body>
<div class="bar">
  <label class="btn solid">Upload picture<input id="fTop" type="file" accept="image/*" hidden></label>
  <div class="tabs" role="tablist" aria-label="Editor">
    <button role="tab" id="tabPic" aria-selected="true" data-tab="pic">Picture</button>
    <button role="tab" id="tabText" aria-selected="false" data-tab="text">Text</button>
  </div>
  <span class="sp"></span>
  <button id="undo" disabled>Undo</button>
  <button id="save" disabled>Save</button>
</div>
<div class="bar" id="picTools" role="tabpanel" aria-labelledby="tabPic">
  <span class="grp">Cut out</span>
  <button data-mode="rect" class="on">Rectangle</button>
  <button data-mode="trace">Trace</button>
  <button data-mode="lasso">Lasso</button>
  <button data-mode="brush">Brush</button>
  <span class="grp">Effects</span>
  <button data-mode="pixel">Pixelate</button>
  <span class="grp">Layers</span>
  <label class="btn" id="underBtn" hidden><span id="underLbl">Add picture underneath</span><input id="fUnder" type="file" accept="image/*" hidden></label>
  <button data-mode="under" id="underTool" hidden>Move underneath</button>
  <button data-mode="pan">Move view</button>
</div>
<div class="bar" id="txtTools" role="tabpanel" aria-labelledby="tabText" hidden>
  <span class="grp">Select text</span>
  <button data-mode="tfree">Freehand</button>
  <button data-mode="tbox">Box</button>
  <span class="grp">New</span>
  <button data-mode="tadd">Add text</button>
  <button data-mode="pan">Move view</button>
</div>
<div class="bar" id="ctx"></div>
<div class="bar" id="ctx2" hidden></div>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="empty"><div><div class="big">Cut, fix and retype.</div><p>Upload a picture. The Picture tab cuts, pixelates and layers. The Text tab reads the text you circle, matches its font, and erases or replaces it.</p><label class="btn">Upload picture<input id="fTop2" type="file" accept="image/*" hidden></label></div></div>
  <div id="zoom"><button id="zOut" aria-label="Zoom out">−</button><span id="zLbl">100%</span><button id="zIn" aria-label="Zoom in">+</button><button id="zFit">Fit</button></div>
</div>
<div id="out"><img id="outImg" alt="Edited picture"><p>Press and hold (or right-click) the picture to save it.</p><button class="solid" id="closeOut">Done</button></div>

<script>
const $=s=>document.querySelector(s),view=$('#view'),ctx=view.getContext('2d');
const S={W:0,H:0,base:null,mask:null,under:null,tab:'pic',mode:'rect',last:{pic:'rect',text:'tfree'},phase:'idle',erase:false,size:10,sc:1,tx:0,ty:0,hist:[],drag:null,pts:null,cur:null,
  texts:[],edit:null,editSnapped:false,field:null,fbrush:0,fsize:12,fbusy:false,clip:null,nid:1,busy:false,note:'',pix:14,grain:55,scatter:40};
let sampleFn=null,canImg=false,dl=null,apiMode=!window.claude;
const MASKC='#FF2D7A',ptrs=new Map(),crops=new Map();let pinch=null;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const cp=c=>{const n=mk(c.width,c.height);n.getContext('2d').drawImage(c,0,0);return n};
const mx=()=>S.mask.getContext('2d');
const aiOK=()=>!!(sampleFn&&canImg||apiMode);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clampN=(v,a,b)=>Math.min(b,Math.max(a,v));
function readImg(f,cb){if(!f)return;const i=new Image();i.onload=()=>cb(i);i.src=URL.createObjectURL(f)}

/* loading */
function loadTop(f){readImg(f,img=>{const k=Math.min(1,3000/Math.max(img.width,img.height));
  S.W=Math.round(img.width*k);S.H=Math.round(img.height*k);S.base=mk(S.W,S.H);S.base.getContext('2d').drawImage(img,0,0,S.W,S.H);
  S.mask=mk(S.W,S.H);S.hist=[];S.texts=[];S.edit=null;S.field=null;S.fbrush=0;S.note='';S.under=null;S.phase='idle';S.pts=null;crops.clear();
  $('#empty').style.display='none';$('#save').disabled=false;$('#underBtn').hidden=false;$('#underTool').hidden=true;$('#underLbl').textContent='Add picture underneath';
  updUndo();fit();setMode(S.mode)})}
$('#fTop').onchange=e=>{loadTop(e.target.files[0]);e.target.value=''};$('#fTop2').onchange=$('#fTop').onchange;
$('#fUnder').onchange=e=>{readImg(e.target.files[0],img=>{snap();const c=mk(img.width,img.height);c.getContext('2d').drawImage(img,0,0);
  S.under={c,x:0,y:0,s:1};fillUnder();$('#underTool').hidden=false;$('#underLbl').textContent='Replace picture underneath';draw()});e.target.value=''};
function fillUnder(){const u=S.under;u.s=Math.max(S.W/u.c.width,S.H/u.c.height);u.x=(S.W-u.c.width*u.s)/2;u.y=(S.H-u.c.height*u.s)/2}

/* view */
function fit(){const r=view.getBoundingClientRect(),d=devicePixelRatio||1;view.width=r.width*d;view.height=r.height*d;
  if(S.W){S.sc=Math.min((r.width-32)/S.W,(r.height-32)/S.H);S.tx=(r.width-S.W*S.sc)/2;S.ty=(r.height-S.H*S.sc)/2}draw()}
addEventListener('resize',fit);
function zoomAt(f,cx,cy){const n=Math.min(64,Math.max(.05,S.sc*f));S.tx=cx-(cx-S.tx)*n/S.sc;S.ty=cy-(cy-S.ty)*n/S.sc;S.sc=n;draw()}
const center=()=>{const r=view.getBoundingClientRect();return[r.width/2,r.height/2]};
$('#zIn').onclick=()=>zoomAt(2,...center());$('#zOut').onclick=()=>zoomAt(.5,...center());$('#zFit').onclick=fit;
view.addEventListener('wheel',e=>{e.preventDefault();const r=view.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const toDoc=p=>({x:(p.x-S.tx)/S.sc,y:(p.y-S.ty)/S.sc}),toScr=p=>({x:p.x*S.sc+S.tx,y:p.y*S.sc+S.ty});

function draw(){const d=devicePixelRatio||1,r=view.getBoundingClientRect();ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);
  $('#zLbl').textContent=Math.round(S.sc*100)+'%';if(!S.W)return;
  ctx.save();ctx.beginPath();ctx.rect(S.tx,S.ty,S.W*S.sc,S.H*S.sc);ctx.clip();
  ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.fillStyle='#d4d4d4';
  for(let y=0;y<r.height;y+=12)for(let x=((y/12)%2)*12;x<r.width;x+=24)ctx.fillRect(x,y,12,12);
  ctx.translate(S.tx,S.ty);ctx.scale(S.sc,S.sc);ctx.imageSmoothingEnabled=S.sc<2;
  if(S.under){const u=S.under;ctx.drawImage(u.c,u.x,u.y,u.c.width*u.s,u.c.height*u.s)}
  ctx.drawImage(S.base,0,0);drawTexts(ctx);
  if(S.tab==='text'){const k=1/S.sc;ctx.lineWidth=1.5*k;
    S.texts.forEach(t=>{const b=hitBox(t),on=t===S.edit;ctx.setLineDash(on?[]:[4*k,3*k]);ctx.strokeStyle=on?'#F2C230':'rgba(242,194,48,.75)';ctx.strokeRect(b.x-3*k,b.y-3*k,b.w+6*k,b.h+6*k)});ctx.setLineDash([]);
    const f=S.field;if(f){ctx.globalAlpha=.6;ctx.drawImage(f.maskC,f.x0,f.y0);ctx.globalAlpha=1}}
  else if(S.phase!=='idle'||S.drag&&S.drag.t==='paint'){ctx.globalAlpha=.5;ctx.drawImage(S.mask,0,0);ctx.globalAlpha=1}
  ctx.restore();
  ctx.lineWidth=2;ctx.strokeStyle='#F2C230';ctx.setLineDash([6,4]);
  if(S.field){ctx.beginPath();S.field.poly.forEach((q,i)=>{const s=toScr(q);i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y)});ctx.closePath();ctx.stroke()}
  if(S.drag&&(S.drag.t==='rect'||S.drag.t==='tbox')){const a=toScr(S.drag.a),b=toScr(S.drag.b);ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y)}
  if(S.pts&&S.pts.length){ctx.beginPath();S.pts.forEach((q,i)=>{const s=toScr(q);i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y)});
    if(S.mode==='lasso'&&S.cur){const s=toScr(S.cur);ctx.lineTo(s.x,s.y)}ctx.stroke();
    if(S.mode==='lasso'){ctx.setLineDash([]);S.pts.forEach((q,i)=>{const s=toScr(q);ctx.fillStyle=i?'#F2C230':'#fff';ctx.beginPath();ctx.arc(s.x,s.y,i?3:6,0,7);ctx.fill();ctx.stroke()})}}
  const brush=S.tab==='pic'?(S.phase==='paint'||S.mode==='pixel')&&S.size:S.field&&S.fbrush&&S.fsize;
  if(brush&&S.cur){ctx.setLineDash([]);const s=toScr(S.cur),rr=Math.max(1,brush/2*S.sc);
    ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.beginPath();ctx.arc(s.x,s.y,rr,0,7);ctx.stroke();ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,rr+1,0,7);ctx.stroke()}
  ctx.setLineDash([]);
}

/* history */
function snap(){S.hist.push({b:cp(S.base),u:S.under&&{...S.under},t:JSON.stringify(S.texts)});if(S.hist.length>20)S.hist.shift();updUndo()}
function updUndo(){$('#undo').disabled=!S.hist.length}
function undo(){const h=S.hist.pop();if(!h)return;S.edit=null;S.field=null;S.fbrush=0;S.base=h.b;S.under=h.u;S.texts=JSON.parse(h.t);
  if(!S.under){$('#underTool').hidden=true;if(S.mode==='under')setMode('rect')}updUndo();bar();draw()}
$('#undo').onclick=undo;

/* tabs, modes & context bars */
function clearSel(){if(S.mask)mx().clearRect(0,0,S.W,S.H);S.pts=null;S.drag=null}
function setTab(tab){if(tab===S.tab)return;closeEdit(true);S.field=null;S.fbrush=0;S.note='';S.last[S.tab]=S.mode;S.tab=tab;
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  $('#picTools').hidden=tab!=='pic';$('#txtTools').hidden=tab!=='text';setMode(S.last[tab])}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function setMode(m){closeEdit(true);S.mode=m;clearSel();S.phase='idle';S.erase=false;if(m!=='pan')S.note='';
  const bars=S.tab==='pic'?'#picTools':'#txtTools';
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m&&!!b.closest(bars)));
  view.style.cursor=m==='pan'||m==='under'?'grab':'crosshair';bar();draw()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>S.W&&setMode(b.dataset.mode));
const tips={rect:'Drag a box over the area.',trace:'Draw around the area in one go.',lasso:'Tap points around the area. Tap the white dot to close.',pan:'Drag to move around. Pinch or scroll to zoom.',
  under:'Drag to position the picture underneath.',pixel:'Paint over an area to pixelate it.',brush:'Set the size, then Start and paint over the area.',
  tfree:'Draw around the text you want to change. Only that area is read. Tap existing text to edit it.',tbox:'Drag a box around the text you want to change. Tap existing text to edit it.',tadd:'Tap where you want new text.'};

function bar(){const [a,b]=!S.W?['<span class="msg">Upload a picture to start.</span>','']:S.tab==='pic'?picBar():textBar();
  $('#ctx').innerHTML=a;$('#ctx2').innerHTML=b;$('#ctx2').hidden=!b;wire()}
function picBar(){
  if(S.phase==='confirm')return['<span class="msg">Is the selection okay?</span><button class="solid" id="bCut">Yes, cut out</button><button id="bAdj">Adjust</button><button id="bRedo">Start over</button>',''];
  if(S.phase==='paint')return[`<button id="bAdd" class="${S.erase?'':'on'}">Add</button><button id="bEr" class="${S.erase?'on':''}">Erase</button><span class="msg">Size</span><input type="range" id="bSz" min="1" max="200" value="${S.size}"><span class="msg" id="szL">${S.size}px</span><button class="solid" id="bFin">Finish</button>`,''];
  if(S.mode==='brush')return[`<span class="msg">Size</span><input type="range" id="bSz" min="1" max="200" value="${S.size}"><span class="msg" id="szL">${S.size}px</span><button class="solid" id="bStart">Start</button>`,''];
  if(S.mode==='lasso'&&S.pts&&S.pts.length)return[`<span class="msg">${tips.lasso}</span><button id="bClose" ${S.pts.length<3?'disabled':''}>Close shape</button><button id="bRedo">Start over</button>`,''];
  if(S.mode==='pixel')return[`<span class="msg">Block</span><input type="range" id="pxSz" min="2" max="60" value="${S.pix}"><span class="msg">Grain</span><input type="range" id="pxGr" min="0" max="100" value="${S.grain}"><span class="msg">Scatter</span><input type="range" id="pxSc" min="0" max="100" value="${S.scatter}"><span class="msg">Brush</span><input type="range" id="pxB" min="6" max="300" value="${S.size}">`,`<span class="msg">${tips.pixel}</span>`];
  if(S.mode==='under'&&S.under)return[`<span class="msg">Size</span><input type="range" id="uSz" min="5" max="400" value="${Math.round(S.under.s*100)}"><button id="uFill">Fill</button><span class="msg">${tips.under}</span>`,''];
  return[`<span class="msg">${tips[S.mode]||''}</span>`,'']}
function textBar(){const t=S.edit,f=S.field;
  if(t){const fl=[...new Set([t.font,...(t.alts||[]),...FONTS])];
    return[`<textarea id="tTxt" rows="${Math.min(4,t.text.split('\n').length)}" aria-label="Text" placeholder="Type text" spellcheck="false">${esc(t.text)}</textarea>`+
      `<select id="tFont" aria-label="Font">${fl.map(n=>`<option ${n===t.font?'selected':''}>${esc(n)}</option>`).join('')}</select>`+
      `<span class="msg">Size</span><input type="range" id="tSz" min="4" max="${Math.max(200,Math.round(S.H/3),Math.round(t.size))}" value="${Math.round(t.size)}">`+
      `<input type="color" id="tCol" value="${t.color}" aria-label="Colour"><span class="msg" id="tWl">Weight ${t.weight}</span><input type="range" id="tW" min="100" max="900" step="100" value="${t.weight}">`+
      `<button id="tI" class="${t.italic?'on':''}" aria-label="Italic"><i>I</i></button><button id="tCopy">Copy style</button>${S.clip?'<button id="tPaste">Paste style</button>':''}`+
      `<button id="tDel" class="danger">Delete</button><button class="solid" id="tDone">Done</button>`,
      `<span class="msg">Spacing</span><input type="range" id="tTr" min="-20" max="80" value="${Math.round(t.track||0)}">`+
      `<span class="msg">Width</span><input type="range" id="tSx" min="30" max="250" value="${Math.round((t.sx||1)*100)}">`+
      `<span class="msg">Height</span><input type="range" id="tSy" min="30" max="250" value="${Math.round((t.sy||1)*100)}">`+
      `<span class="msg">Line gap</span><input type="range" id="tLh" min="70" max="250" value="${Math.round((t.lh||1.2)*100)}">`+
      `<span class="msg">Extra bold</span><input type="range" id="tBo" min="0" max="15" step="0.5" value="${t.bold||0}"><button id="tReset">Reset shape</button>`+
      (t.src&&crops.has(t.id)&&aiOK()?`<button id="tRef" ${S.busy?'disabled':''}>${S.busy?'Matching…':'Refine font match'}</button>`:'')+
      (t.detected?`<span class="msg">Detected: ${esc(t.detected)}</span>`:'')+(S.note?`<span class="msg">${esc(S.note)}</span>`:'')]}
  if(f){let info;
    if(S.fbusy)info='<span class="msg">Erasing…</span>';
    else if(f.status==='reading')info='<span class="msg">Reading the selected text and font…</span>';
    else if(f.status==='ready')info=f.info.text?`<span class="chip" title="${esc(f.info.text)}">${esc(f.info.text.replace(/\n/g,' / '))}</span><span class="msg">${esc(f.detected)}</span><span class="sw" style="background:${f.color}" title="Text colour ${f.color}"></span>`:'<span class="msg">No text found in that area. You can still erase it.</span>';
    else if(f.status==='error')info=`<span class="msg warn">Could not read the text: ${esc(f.err)} You can still erase it and type.</span>`;
    else info='<span class="msg">Text reading is not set up here. You can still erase it and type.</span>';
    const wait=f.status==='reading'||S.fbusy;
    return[info+`<button class="solid" id="fRep" ${wait?'disabled':''}>Replace text</button><button id="fErase" ${S.fbusy?'disabled':''}>Erase text</button><button id="fCopy" ${wait?'disabled':''}>Copy style</button><button id="fCancel">Cancel</button>`,
      `<span class="grp">Remove</span><button id="fGl" class="${f.area?'':'on'}">Letters only</button><button id="fAr" class="${f.area?'on':''}">Whole area</button>`+
      (f.area?'':`<span class="msg">Sensitivity</span><input type="range" id="fSe" min="0" max="100" value="${f.sens}"><span class="msg">Grow</span><input type="range" id="fGr" min="0" max="8" value="${f.grow}">`)+
      `<span class="grp">Fix pink mask</span><button id="fB1" class="${S.fbrush===1?'on':''}">+ Paint</button><button id="fB2" class="${S.fbrush===2?'on':''}">− Unpaint</button>`+
      (S.fbrush?`<input type="range" id="fBs" min="2" max="80" value="${S.fsize}" aria-label="Brush size">`:'')]}
  return[`<span class="msg">${esc(S.note||tips[S.mode]||'')}</span>`+(S.mode==='tadd'&&S.clip?'<span class="msg">Using copied style.</span><button id="clipX">Clear copied style</button>':''),'']}

function makeField(poly){closeEdit(true);S.fbrush=0;S.note='';
  const xs=poly.map(p=>p.x),ys=poly.map(p=>p.y),M=8;
  const x0=Math.max(0,Math.floor(Math.min(...xs))-M),y0=Math.max(0,Math.floor(Math.min(...ys))-M),x1=Math.min(S.W,Math.ceil(Math.max(...xs))+M),y1=Math.min(S.H,Math.ceil(Math.max(...ys))+M),w=x1-x0,h=y1-y0;

function buildMask(f){const {w,h,ins,diff}=f,N=w*h,thr=Math.max(14,f.otsu*(1.6-f.sens/100*1.2));

      for(let dy=-1;dy<=1&&!n[i];dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<w&&Y<h&&g[Y*w+X]){n[i]=1;break}}}g=n}

  if(x1<0){const xs=f.poly.map(p=>p.x),ys=f.poly.map(p=>p.y);f.ink={x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};f.color='#000000';return}

function fieldDab(p){const f=S.field,r=S.fsize/2,v=S.fbrush===1?1:0,cx=p.x-f.x0,cy=p.y-f.y0;

    if((x+.5-cx)**2+(y+.5-cy)**2<=r*r)f.glyph[y*f.w+x]=v;paintMask(f)}

// Replaces masked pixels with texture copied from the surrounding background (patch-based, onion-peel order).

const READ_PROMPT=`This image is a close-up crop from a picture. Read ONLY the text inside the clear area; ignore anything in the greyed-out area.
Act as a typography expert and identify the typeface by studying the letterforms: serif or sans, geometric/grotesque/humanist, stroke contrast, terminals, x-height, aperture, and distinctive glyphs (a, g, R, Q, t, y, numerals).
Reply with only JSON: {"text":"the exact text, keeping its capitalisation, lines separated by \\n","font":"most likely exact typeface","googleFont":"closest Google Fonts family","alternatives":["2-4 other close Google Fonts"],"weight":400,"italic":false,"letterSpacing":0,"reason":"one short sentence"}.
weight is 100-900; letterSpacing is extra spacing between letters in percent of the font size (0 is normal). If there is no text reply {"text":""}.`;
function cleanInfo(r){r=r||{};const gf=String(r.googleFont||'').trim();return{text:String(r.text||'').replace(/\r/g,'').trim(),font:String(r.font||'').trim(),googleFont:gf||'Inter',
  alternatives:Array.isArray(r.alternatives)?r.alternatives.map(v=>String(v).trim()).filter(Boolean).slice(0,4):[],weight:clampN(Math.round((+r.weight||400)/100)*100,100,900),
  italic:!!r.italic,letterSpacing:isFinite(+r.letterSpacing)?clampN(+r.letterSpacing,-20,80):0,reason:String(r.reason||'')}}
const describe=i=>(i.font&&i.font!==i.googleFont?`${i.font} (using ${i.googleFont})`:i.googleFont)+` · ${i.weight}${i.italic?' italic':''}`;
function errMsg(e){return({not_granted:'Text reading was not allowed.',rate_limited:'Too many requests. Try again shortly.',image_rejected:'The picture could not be read.',invalid_json:'The result could not be read. Try again.'}[e&&e.code])||(e&&e.message)||'Try again.'}
async function fieldBlob(f){const k=clampN(1200/Math.max(f.w,f.h),1,4),c=mk(Math.round(f.w*k),Math.round(f.h*k)),x=c.getContext('2d');
  x.imageSmoothingQuality='high';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(S.base,f.x0,f.y0,f.w,f.h,0,0,c.width,c.height);

async function readField(f){try{f.blob=await fieldBlob(f);const i=cleanInfo(await askVision(f.blob,READ_PROMPT));
    await ensureFont({font:i.googleFont,weight:i.weight,italic:i.italic});(i.alternatives||[]).forEach(loadFont);
    f.info=i;f.detected=describe(i);f.status='ready'}

// Font, size, width and position that make the recognised text sit exactly on the original letters.
function fitStyle(i,ink,color){const t={font:i.googleFont||'Inter',alts:i.alternatives||[],weight:i.weight||400,italic:!!i.italic,color,track:i.letterSpacing||0,sx:1,sy:1,lh:1.2,bold:0,size:100,x:ink.x,y:ink.y};

const fieldStyle=f=>fitStyle(f.info||{},f.ink,f.color);
function eraseFieldNow(f){snap();inpaint(f)}
function fieldBusy(fn){S.fbusy=true;bar();setTimeout(()=>{fn();S.fbusy=false;bar();draw()},30)}
function fieldErase(){const f=S.field;if(!f)return;fieldBusy(()=>{eraseFieldNow(f);S.field=null;S.fbrush=0;S.note='Text erased. Undo to bring it back.'})}
function fieldReplace(){const f=S.field;if(!f)return;fieldBusy(()=>{const st=fieldStyle(f);eraseFieldNow(f);
  const t={id:S.nid++,text:f.info&&f.info.text||'',...st,src:f.info&&f.info.text?{ink:f.ink,text:f.info.text}:null,detected:f.detected||''};

  setTimeout(()=>startEdit(t,true,true))})}
async function refineFont(t){const blob=crops.get(t&&t.id);if(!blob||S.busy)return;S.busy=true;S.note='';bar();
  try{const i=cleanInfo(await askVision(blob,READ_PROMPT+`\nLook very closely: an earlier guess was "${t.detected||t.font}". Confirm it or correct it.`));
    await ensureFont({font:i.googleFont,weight:i.weight,italic:i.italic});i.alternatives.forEach(loadFont);
    const st=fitStyle({...i,text:t.src.text},t.src.ink,t.color);snap();

  catch(e){S.note='Font match failed: '+errMsg(e)}
  S.busy=false;bar();draw()}

/* vision: Claude runtime inside claude.ai, or /api/find-text when hosted (e.g. Vercel) */
async function apiFind(blob,prompt){const b64=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=no;fr.readAsDataURL(blob)});
  let res;try{res=await fetch('/api/find-text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,mediaType:blob.type||'image/jpeg',prompt})})}
  catch(e){throw{message:'Could not reach /api/find-text.'}}
  if(!res.ok){let m='';try{m=(await res.json()).error||''}catch(e){}
    throw{message:res.status===404?'/api/find-text was not found. Deploy the api folder next to index.html.':(m||'Server error '+res.status)+'.'}}
  return res.json()}
async function askVision(blob,prompt){return sampleFn?await sampleFn.json(prompt,{images:blob,modelTier:'complex'}):await apiFind(blob,prompt)}

(async()=>{if(!window.claude)return;try{const [smp,d]=await Promise.all([claude.use('sample'),claude.use('downloads')]);dl=d;
  if(smp){sampleFn=smp;const l=await smp.limits().catch(()=>null);canImg=!!(l&&l.images)}}catch(e){}bar()})();
fit();bar();
